name: Build & Sign Android APK (São Tomás de Aquino)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código-fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK de Teste (Debug) e APK Assinado (Release)
        run: |
          gradle assembleDebug assembleRelease

      - name: Disponibilizar APK Debug Instalável
        uses: actions/upload-artifact@v4
        with:
          name: SaoTomasDeAquino-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Disponibilizar APK Release Assinado
        uses: actions/upload-artifact@v4
        with:
          name: SaoTomasDeAquino-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk
